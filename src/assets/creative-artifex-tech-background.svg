  <circle cx="227" cy="43" r="18" fill="#087AFF" opacity=".18" filter="url(#softGlow)"/>

  <!-- Left code block -->
  <g class="code">
    <text x="80" y="211">// Software development</text>
    <text x="80" y="228">// Software Solution</text>
    <text x="80" y="252">import &#123; useEffect, useState &#125; from 'react';</text>
    <text x="80" y="270">import &#123; FiCode, FiCpu, FiDatabase &#125; from 'react-icons/fi';</text>
    <text x="80" y="302">const App = () =&gt; &#123;</text>
    <text x="98" y="320">const [data, setData] = useState([]);</text>
    <text x="98" y="350">useEffect(() =&gt; &#123;</text>
    <text x="116" y="368">fetchData();</text>
    <text x="98" y="386">&#125;, []);</text>
    <text x="98" y="414">const fetchData = async () =&gt; &#123;</text>
    <text x="116" y="432">const response = await fetch('/api/data');</text>
    <text x="116" y="450">const result = await response.json();</text>
    <text x="116" y="468">setData(result);</text>
    <text x="98" y="486">&#125;;</text>
    <text x="98" y="522">return (</text>
    <text x="116" y="540">&lt;div className="app"&gt;</text>
    <text x="134" y="558">&lt;h1&gt;Innovate. Build. Elevate.&lt;/h1&gt;</text>
    <text x="134" y="576">&lt;p&gt;Powering ideas with smart software solutions&lt;/p&gt;</text>
    <text x="116" y="594">&lt;/div&gt;</text>
    <text x="98" y="612">);</text>
    <text x="80" y="648">&#125;;</text>
    <text x="80" y="682">export default App;</text>
  </g>

  <!-- Right top dot matrix -->
  <rect x="1090" y="-10" width="350" height="315" fill="url(#dots)" opacity=".8"/>
  <rect x="1210" y="20" width="230" height="190" fill="url(#dots)" opacity=".45"/>

