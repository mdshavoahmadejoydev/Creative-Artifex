<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 744" width="1440" height="744">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061A5B"/>
      <stop offset="0.48" stop-color="#020D3A"/>
      <stop offset="1" stop-color="#00144F"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#147CFF" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#0A4CDB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00154F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#006CFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#008CFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4BA8FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#1264E8" opacity=".72"/>
      <circle cx="16" cy="16" r="1.5" fill="#1264E8" opacity=".45"/>
    </pattern>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .circuit { fill:none; stroke:#0871F9; stroke-width:1.4; opacity:.58; }
      .circuit2 { fill:none; stroke:#0A56C9; stroke-width:1; opacity:.38; }
      .node { fill:#061A5B; stroke:#0871F9; stroke-width:1.5; }
      .code { font-family:monospace; font-size:10px; fill:#0761D8; opacity:.42; }
      .icon { fill:none; stroke:#0864D9; stroke-width:2; opacity:.52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="744" fill="url(#bg)"/>

  <!-- Soft blue atmospheric glows -->
  <ellipse cx="210" cy="110" rx="330" ry="260" fill="url(#glow)" opacity=".38"/>
  <ellipse cx="1290" cy="520" rx="360" ry="300" fill="url(#glow)" opacity=".42"/>

  <!-- Top-left circuit network -->
  <g class="circuit">
    <path d="M0 32H22V0"/>
    <path d="M16 0V42L75 101H157"/>
    <path d="M0 77H44L91 30H166L198 0"/>
    <path d="M0 111H28L76 63H174L238 0"/>
    <path d="M0 151H62L113 100H205L271 34H336"/>
    <path d="M0 190H92L143 139H248L318 69H396"/>
    <path d="M28 248V211H112L174 149H260"/>
    <path d="M0 274H52L91 235H169"/>
    <path d="M157 100H214L250 64H320"/>
  </g>

  <g class="circuit2">
